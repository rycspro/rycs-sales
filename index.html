<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070B14" />
    <meta name="description" content="RYCS Sales Solutions — plataforma de vendas por ação verificada" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>RYCS Sales Solutions</title>
    <link rel="icon" href="/logo-rycs.png">
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo-rycs.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Remove qualquer service worker legado. Ver comentário em public/sw.js.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then((rs) => rs.forEach((r) => r.unregister()))
          .catch(() => {});
        if (window.caches) {
          caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
        }
      }
    </script>
  </body>
</html>
