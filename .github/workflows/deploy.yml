name: Deploy to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/rycs-sales
            git pull origin main
            docker build -t rycs-app .
            docker stop rycs-app || true
            docker rm rycs-app || true
            docker run -d \
              --name rycs-app \
              --restart unless-stopped \
              --env-file /home/ec2-user/env_producao.txt \
              -v /data:/data \
              -p 80:3001 \
              rycs-app
            sleep 5
            docker ps
            curl -sf http://localhost/api/health && echo "Deploy OK" || echo "ALERTA: health check falhou apos deploy"
