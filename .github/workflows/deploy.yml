name: Deploy to AWS

# Estrutura de proteção da produção (app.rycs.pro):
#   1. Job "validar": roda no runner do GitHub ANTES de tocar no servidor.
#      node --check em todo o server (pega erro de sintaxe que derruba o boot)
#      e npm run build (pega erro de frontend). Falhou -> o deploy NÃO roda.
#   2. Job "deploy": sobe a versão nova, faz health check com retry e, se o
#      container novo não ficar saudável, faz ROLLBACK automático para a
#      imagem anterior e falha o workflow. Produção não fica fora do ar.
#   3. concurrency: dois pushes na main são enfileirados, nunca sobrepostos.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm ci
      - name: Checar sintaxe do servidor (evita crash no boot)
        run: |
          erro=0
          while IFS= read -r f; do
            node --check "$f" || erro=1
          done < <(find server -name '*.js')
          if [ "$erro" != "0" ]; then
            echo "::error::Erro de sintaxe no server/ — deploy abortado."
            exit 1
          fi
          echo "Sintaxe do server OK"
      - name: Lint do backend (pega variável/import indefinido — ReferenceError)
        run: npm run lint
      - name: Build do frontend
        run: npm run build
      - name: Testes (apenas a suíte deste repo, em test/)
        run: npm test

  deploy:
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to EC2 (com health check e rollback)
        uses: appleboy/ssh-action@v1.0.3
        env:
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: "1450354278156274"
          WHATSAPP_WABA_ID: "1116584101362389"
          PLANOS_PROFISSIONAL_ATIVO: "1"
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          ZAPSIGN_API_TOKEN: ${{ secrets.ZAPSIGN_API_TOKEN }}
          ZAPSIGN_SANDBOX: ${{ secrets.ZAPSIGN_SANDBOX }}
        with:
          host: 3.132.225.173
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 20m
          envs: META_VERIFY_TOKEN,META_APP_SECRET,META_APP_ID,WHATSAPP_TOKEN,WHATSAPP_PHONE_NUMBER_ID,WHATSAPP_WABA_ID,PLANOS_PROFISSIONAL_ATIVO,RESEND_WEBHOOK_SECRET,META_CAPI_TOKEN,META_ADS_TOKEN,ZAPSIGN_API_TOKEN,ZAPSIGN_SANDBOX
          script: |
            set -e
            for nome in META_VERIFY_TOKEN META_APP_SECRET META_APP_ID WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_WABA_ID PLANOS_PROFISSIONAL_ATIVO RESEND_WEBHOOK_SECRET META_CAPI_TOKEN META_ADS_TOKEN ZAPSIGN_API_TOKEN ZAPSIGN_SANDBOX; do
              valor="${!nome}"
              if [ -n "$valor" ]; then
                sed -i "/^$nome=/d" /home/ec2-user/env_producao.txt
                echo "$nome=$valor" >> /home/ec2-user/env_producao.txt
              fi
            done
            cd /home/ec2-user/rycs-sales
            git fetch origin main
            git reset --hard origin/main

            # Preserva a versão atual como imagem de rollback.
            if docker image inspect rycs-app:current >/dev/null 2>&1; then
              docker tag rycs-app:current rycs-app:rollback
            elif docker image inspect rycs-app:latest >/dev/null 2>&1; then
              docker tag rycs-app:latest rycs-app:rollback
            fi

            # Build da nova versão com tag de candidato (não promove ainda).
            docker build -t rycs-app:candidate .

            # Sobe o candidato.
            docker stop rycs-app 2>/dev/null || true
            docker rm rycs-app 2>/dev/null || true
            docker run -d \
              --name rycs-app \
              --restart unless-stopped \
              --env-file /home/ec2-user/env_producao.txt \
              -v /data:/data \
              -p 127.0.0.1:3001:3001 \
              rycs-app:candidate

            # Health check com retry (~60s no total).
            ok=0
            for i in $(seq 1 20); do
              if curl -sf --max-time 5 http://127.0.0.1:3001/api/health >/dev/null; then
                ok=1; break
              fi
              sleep 3
            done

            if [ "$ok" = "1" ]; then
              docker tag rycs-app:candidate rycs-app:current
              docker image prune -f >/dev/null 2>&1 || true
              echo "Deploy OK — versão nova está saudável."
            else
              echo "ALERTA: health check falhou. Executando ROLLBACK."
              docker logs --tail 40 rycs-app 2>&1 || true
              docker stop rycs-app 2>/dev/null || true
              docker rm rycs-app 2>/dev/null || true
              if docker image inspect rycs-app:rollback >/dev/null 2>&1; then
                docker run -d \
                  --name rycs-app \
                  --restart unless-stopped \
                  --env-file /home/ec2-user/env_producao.txt \
                  -v /data:/data \
                  -p 127.0.0.1:3001:3001 \
                  rycs-app:rollback
                echo "ROLLBACK aplicado — versão anterior restaurada no ar."
              else
                echo "Sem imagem de rollback disponível — intervenção manual necessária."
              fi
              exit 1
            fi
