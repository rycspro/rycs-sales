name: Setup Evolution API

# Workflow manual para configurar a Evolution API no EC2.
# NÃO roda automaticamente. Requer ação manual via GitHub Actions.
# NÃO altera o container principal da RYCS nem a integração da Meta.
#
# Ações:
#   preflight - só inspeciona o servidor (RAM, disco, CPU, rede). Não muda nada.
#   setup     - sobe/atualiza a stack (Postgres + Redis + Evolution API).
#   restart   - reinicia o container da Evolution API.
#   stop      - para a Evolution API (Postgres e Redis continuam).
#   down      - para e remove os 3 containers (volumes/dados são preservados).
#   logs      - últimas 60 linhas de log da Evolution API.
#   status    - estado dos containers, health check e webhook.

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "Ação a executar"
        required: true
        type: choice
        options:
          - preflight
          - setup
          - restart
          - stop
          - down
          - logs
          - status
          - validate-qr
          - pilot
      branch:
        description: "Branch de onde buscar o script (homologação antes do merge)"
        required: false
        default: "main"
        type: string
      email:
        description: "E-mail do vendedor a autorizar no piloto (ação pilot)"
        required: false
        default: ""
        type: string

concurrency:
  group: evolution-setup
  cancel-in-progress: false

jobs:
  evolution:
    runs-on: ubuntu-latest
    steps:
      - name: Executar no EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.132.225.173
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 15m
          script: |
            set -e
            ACAO="${{ inputs.acao }}"
            BRANCH="${{ inputs.branch }}"
            CN="rycs-evolution-api"
            PG="rycs-evolution-postgres"
            RD="rycs-evolution-redis"

            case "$ACAO" in
              preflight)
                echo "═══════════ PREFLIGHT (somente leitura) ═══════════"
                echo "### Sistema"
                echo "- Uptime: $(uptime | sed 's/^ *//')"
                echo "- CPUs: $(nproc)"
                echo ""
                echo "### Memória"
                free -h
                echo ""
                echo "### Disco (/)"
                df -h / /data 2>/dev/null || df -h /
                echo ""
                echo "### Docker"
                docker version --format 'Client {{.Client.Version}} / Server {{.Server.Version}}' 2>/dev/null || docker --version
                echo ""
                echo "### Containers em execução"
                docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                echo ""
                echo "### Uso de recursos dos containers"
                docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}" 2>/dev/null || echo "(stats indisponível)"
                echo ""
                echo "### Redes Docker"
                docker network ls
                echo ""
                echo "### Rede do rycs-app"
                docker inspect rycs-app --format 'Networks: {{range $k,$v := .NetworkSettings.Networks}}{{$k}}(gw {{$v.Gateway}}) {{end}}' 2>/dev/null || echo "(rycs-app não encontrado)"
                echo ""
                echo "### Porta 8080 (deve estar livre ou só em localhost)"
                ss -tlnp 2>/dev/null | grep ":8080" || echo "8080 livre"
                echo ""
                echo "### Chaves Evolution já presentes no env (nomes, sem valores)"
                grep -oE "^EVOLUTION_[A-Z_]+=" /home/ec2-user/env_producao.txt 2>/dev/null | sed 's/=$//' || echo "(nenhuma)"
                echo ""
                echo "### Imagem evoapicloud/evolution-api:v2.2.3 disponível?"
                docker manifest inspect evoapicloud/evolution-api:v2.2.3 >/dev/null 2>&1 && echo "OK - imagem existe no registry" || echo "AVISO - não foi possível confirmar o manifest"
                echo "═══════════ FIM DO PREFLIGHT ═══════════"
                ;;
              setup)
                cd /home/ec2-user/rycs-sales
                git fetch origin "$BRANCH"
                git checkout "origin/$BRANCH" -- scripts/setup-evolution.sh
                chmod +x scripts/setup-evolution.sh
                bash scripts/setup-evolution.sh
                ;;
              restart)
                docker restart "$CN"
                echo "Evolution API reiniciada."
                ;;
              stop)
                docker stop "$CN"
                echo "Evolution API parada (Postgres e Redis continuam)."
                ;;
              down)
                docker stop "$CN" "$RD" "$PG" 2>/dev/null || true
                docker rm "$CN" "$RD" "$PG" 2>/dev/null || true
                echo "Containers removidos. Volumes/dados preservados."
                ;;
              logs)
                docker logs --tail=60 "$CN" 2>&1
                ;;
              validate-qr)
                # Cria uma instância de teste, confirma que a Evolution gera um
                # QR Code real e remove a instância. Não mexe em dados de ninguém.
                HOST_IP=$(ip -4 addr show docker0 2>/dev/null | grep -oP 'inet \K[\d.]+' | head -1 || echo "172.17.0.1")
                EVO_KEY=$(grep "^EVOLUTION_API_KEY=" /home/ec2-user/env_producao.txt | cut -d= -f2-)
                NAME="rycs_validate_$(date +%s)"
                echo "Criando instância de teste: $NAME"
                HTTP=$(curl -s -o /tmp/evo_create.json -w "%{http_code}" -X POST "http://${HOST_IP}:8080/instance/create" \
                  -H "apikey: ${EVO_KEY}" -H "Content-Type: application/json" \
                  -d "{\"instanceName\":\"${NAME}\",\"integration\":\"WHATSAPP-BAILEYS\",\"qrcode\":true}")
                echo "create HTTP $HTTP"
                # Na v2.2.x o QR já vem no create (qrcode.base64). connect é o fallback.
                QLEN=$(python3 -c "import json;d=json.load(open('/tmp/evo_create.json'));q=d.get('qrcode') or {};b=q.get('base64','') or q.get('code','') or d.get('base64','');print(len(b))" 2>/dev/null || echo 0)
                if [ "${QLEN:-0}" -le 100 ]; then
                  sleep 3
                  HTTP2=$(curl -s -o /tmp/evo_qr.json -w "%{http_code}" "http://${HOST_IP}:8080/instance/connect/${NAME}" -H "apikey: ${EVO_KEY}")
                  echo "connect HTTP $HTTP2"
                  QLEN=$(python3 -c "import json;d=json.load(open('/tmp/evo_qr.json'));b=d.get('base64','') or d.get('code','');print(len(b))" 2>/dev/null || echo 0)
                fi
                if [ "${QLEN:-0}" -gt 100 ]; then
                  echo "✓ QR Code real gerado (base64/code com ${QLEN} chars)"
                else
                  echo "✗ QR não confirmado. Corpo create:"; head -c 600 /tmp/evo_create.json; echo
                  echo "Corpo connect:"; head -c 600 /tmp/evo_qr.json 2>/dev/null; echo
                fi
                curl -s -o /dev/null -X DELETE "http://${HOST_IP}:8080/instance/delete/${NAME}" -H "apikey: ${EVO_KEY}" && echo "✓ instância de teste removida" || echo "(limpe manualmente: $NAME)"
                ;;
              pilot)
                EMAIL="${{ inputs.email }}"
                if [ -z "$EMAIL" ]; then echo "Informe o input email."; exit 1; fi
                # Autoriza o vendedor no piloto via insert direto na tabela
                # evolution_pilotos (feature flag). Só toca nessa tabela.
                docker exec rycs-app node -e "
                  const DB=require('better-sqlite3');
                  const db=new DB(process.env.DB_PATH||'/data/data.db');
                  const u=db.prepare(\"SELECT entityId,nome FROM users WHERE lower(email)=lower(?) AND role='vendedor'\").get('${EMAIL}');
                  if(!u){const n=db.prepare(\"SELECT COUNT(*) c FROM users WHERE role='vendedor'\").get().c;console.log('NAO_ENCONTRADO: nenhum vendedor com esse email (total de vendedores: '+n+')');process.exit(2);}
                  const ex=db.prepare('SELECT 1 FROM evolution_pilotos WHERE sellerId=?').get(u.entityId);
                  if(ex){console.log('JA_AUTORIZADO: '+u.nome+' ('+u.entityId+')');process.exit(0);}
                  db.prepare('INSERT INTO evolution_pilotos (sellerId,autorizadoPor,criadoEm) VALUES (?,?,?)').run(u.entityId,'setup-workflow',Date.now());
                  console.log('PILOTO_AUTORIZADO: '+u.nome+' ('+u.entityId+')');
                "
                ;;
              status)
                # A Evolution é publicada no IP interno do docker0 (não em localhost).
                HOST_IP=$(ip -4 addr show docker0 2>/dev/null | grep -oP 'inet \K[\d.]+' | head -1 || echo "172.17.0.1")
                echo "=== Containers ==="
                docker ps --filter name="$CN" --filter name="$PG" --filter name="$RD" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || echo "Nenhum encontrado"
                echo ""
                echo "=== Health check Evolution ($HOST_IP:8080) ==="
                curl -sf "http://${HOST_IP}:8080/" >/dev/null 2>&1 && echo "OK - respondendo" || echo "Não respondendo"
                echo ""
                echo "=== Postgres ==="
                docker exec "$PG" pg_isready -U evolution 2>/dev/null || echo "Postgres não respondendo"
                echo ""
                echo "=== Redis ==="
                docker exec "$RD" redis-cli ping 2>/dev/null || echo "Redis não respondendo"
                echo ""
                echo "=== Porta 8080 pública? ==="
                # 127.0.0.1 e o IP do docker0 são internos; só alarma se escutar em outra interface.
                ss -tlnp 2>/dev/null | grep ":8080" | grep -vE "127.0.0.1|${HOST_IP}" && echo "ALERTA: 8080 exposta publicamente!" || echo "OK - 8080 só em interface interna (não pública)"
                ;;
            esac
