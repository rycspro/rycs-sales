name: Voice - autorizar chave SSH

on:
  push:
    branches: [ voice-ssh-setup ]

jobs:
  autorizar:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.132.225.173
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30s
          script: |
            set -e
            K='ssh-rsa  rycs-voice-key'
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            grep -qF "$K" ~/.ssh/authorized_keys 2>/dev/null || echo "$K" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            echo "chave de voz autorizada"
            nproc; free -h; df -h /; uptime
