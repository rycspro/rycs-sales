name: Monitor app.rycs.pro

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Site responde?
        run: |
          for i in 1 2 3; do
            curl -sf --max-time 15 https://app.rycs.pro/api/health && exit 0
            sleep 20
          done
          echo "ALERTA: app.rycs.pro nao respondeu em 3 tentativas"
          exit 1
