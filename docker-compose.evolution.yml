# Evolution API — microsserviço independente para WhatsApp pessoal via Baileys.
# NÃO faz parte do processo principal da RYCS. Roda ao lado do container
# principal e se comunica com o backend por HTTP na rede interna.
#
# Uso:
#   docker compose -f docker-compose.evolution.yml up -d
#
# Em produção, garantir:
#   - EVOLUTION_API_KEY definida e forte
#   - AUTHENTICATION_API_KEY igual à EVOLUTION_API_KEY
#   - Volumes persistentes para sessões
#   - Não expor a porta 8080 publicamente (só o backend RYCS acessa)

version: "3.8"

services:
  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: rycs-evolution-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # ── Servidor ──
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      SERVER_PORT: 8080

      # ── Autenticação ──
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-in-production}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # ── Armazenamento ──
      DATABASE_ENABLED: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ""

      # ── Instâncias ──
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: "RYCS"
      CONFIG_SESSION_PHONE_NAME: Chrome

      # ── Webhook global → backend RYCS ──
      WEBHOOK_GLOBAL_URL: ${EVOLUTION_WEBHOOK_URL:-http://host.docker.internal:3001/api/webhooks/evolution}
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_APPLICATION_STARTUP: "false"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_SET: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_MESSAGES_DELETE: "false"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_CONTACTS_SET: "false"
      WEBHOOK_EVENTS_CONTACTS_UPSERT: "false"
      WEBHOOK_EVENTS_CONTACTS_UPDATE: "false"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_SET: "false"
      WEBHOOK_EVENTS_CHATS_UPSERT: "false"
      WEBHOOK_EVENTS_CHATS_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_DELETE: "false"
      WEBHOOK_EVENTS_GROUPS_UPSERT: "false"
      WEBHOOK_EVENTS_GROUPS_UPDATE: "false"
      WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_CALL: "false"
      WEBHOOK_EVENTS_TYPEBOT_START: "false"
      WEBHOOK_EVENTS_TYPEBOT_CHANGE_STATUS: "false"

      # ── Baileys ──
      STORE_MESSAGES: "false"
      STORE_MESSAGE_UP: "false"
      STORE_CONTACTS: "false"
      STORE_CHATS: "false"
      CLEAN_STORE_CLEANING_INTERVAL: "7200"
      CLEAN_STORE_MESSAGES: "true"
      CLEAN_STORE_MESSAGE_UP: "true"
      CLEAN_STORE_CONTACTS: "true"
      CLEAN_STORE_CHATS: "true"

      # ── Logs ──
      LOG_LEVEL: WARN
      LOG_COLOR: "true"
      LOG_BAILEYS: error

    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - rycs-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  evolution_instances:
    driver: local

networks:
  rycs-internal:
    driver: bridge
