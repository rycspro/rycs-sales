<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupo de suporte | RYCS</title>
<meta name="description" content="Grupo de suporte da RYCS no WhatsApp.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-rycs.png">
<!-- Botão "Entrar no grupo de suporte" dos modelos de WhatsApp: a Meta não aceita
     botão apontando direto para chat.whatsapp.com, então o botão abre esta página.
     Cores da marca: src/styles.js (--brand, --ink, --muted, --bg). -->
<style>:root{--fg:#171B24;--muted:#667085;--bg:#F6F7F9;--card:#fff;--line:#E4E6EC;--brand:#2563EB;--brand-600:#1D4ED8;--on-brand:#fff;--link:#2563EB}
@media (prefers-color-scheme:dark){:root{--fg:#ECEEF3;--muted:#A3A9B6;--bg:#12141A;--card:#1A1D24;--line:#2A2E38;--link:#60A5FA}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 16px 64px}header{margin-bottom:24px}header img{height:32px}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
h1{font-size:24px;line-height:1.3;margin:0 0 8px}p{margin:0 0 16px}.muted{color:var(--muted);font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border-radius:12px;background:var(--brand);color:var(--on-brand);font-weight:600;text-decoration:none;margin:24px 0 12px}
.btn:hover{background:var(--brand-600)}
a:focus-visible{outline:3px solid var(--link);outline-offset:3px}
.link{display:inline-flex;align-items:center;min-height:44px;color:var(--link)}
nav{margin-top:20px;font-size:14px}nav a{display:inline-flex;align-items:center;min-height:44px;margin-right:16px;color:var(--muted)}</style>
</head>
<body><main>
<header><a href="https://rycs.pro"><img src="/logo-rycs.png" alt="RYCS"></a></header>
<article>
<h1>Grupo de suporte da RYCS</h1>
<p>Tire suas dúvidas sobre a plataforma com a equipe da RYCS e com outros profissionais, no WhatsApp.</p>
<p class="muted">Em grupos do WhatsApp, os participantes podem ver o seu número.</p>
<a class="btn" href="https://chat.whatsapp.com/JwEOA8RTFrA5oHIpQaSvss" rel="noopener">Entrar no grupo</a>
<a class="link" href="https://app.rycs.pro/plataforma?aba=perfil">Completar meu perfil</a>
</article>
<nav><a href="/privacidade/">Política de Privacidade</a><a href="/termos/">Termos de Uso</a></nav>
</main></body></html>
